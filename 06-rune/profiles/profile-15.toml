protocol = "rune-http-v1"
ruleset = "rune-deterministic-v2"
profile = "profile-15"
initial_tasks = [
  { id = "seed-noise-0", task_type = "Noise" },
]

[[releases]]
id = "noise-wave"
task_type = "Noise"
at = { min = 90, max = 150 }
count = { min = 12, max = 16 }

[[releases]]
id = "late-cpu"
task_type = "CpuLeaf"
at = { min = 240, max = 320 }
count = { min = 8, max = 12 }

[[workflow_templates]]
id = "nested"
instances = { min = 12, max = 16 }
nodes = [
  { id = "a1", task_type = "FastA" },
  { id = "a2", task_type = "SlowA" },
  { id = "gate-a", task_type = "GateA", depends_on = ["a1", "a2"] },
  { id = "b1", task_type = "FastB" },
  { id = "b2", task_type = "SlowB" },
  { id = "gate-b", task_type = "GateB", depends_on = ["b1", "b2"] },
  { id = "final", task_type = "Final", depends_on = ["gate-a", "gate-b"] },
  { id = "cpu", task_type = "CpuLeaf", depends_on = ["final"] },
  { id = "mem", task_type = "MemLeaf", depends_on = ["final"] },
]

[safety_limits]
max_generated_tasks = 1024
max_batch_size = 6
max_identifier_length = 96
max_recent_events = 8192
max_decisions = 50000

[[task_types]]
id = "FastA"
runtime_work = { min = 70, max = 110 }
setup_work = 20
cpu_demand = 6
memory_reservation = 3
failure_prior = { kind = "truncated_geometric", failure_probability = { numerator = 1, denominator = 4 }, max_failures = 2, failure_fraction = { min = { numerator = 1, denominator = 2 }, max = { numerator = 3, denominator = 4 } } }

[[task_types]]
id = "SlowA"
runtime_work = { min = 140, max = 200 }
setup_work = 25
cpu_demand = 4
memory_reservation = 6

[[task_types]]
id = "GateA"
runtime_work = { min = 40, max = 65 }
setup_work = 50
cpu_demand = 4
memory_reservation = 5
required_capabilities = ["gate-a"]

[[task_types]]
id = "FastB"
runtime_work = { min = 80, max = 120 }
setup_work = 20
cpu_demand = 5
memory_reservation = 4

[[task_types]]
id = "SlowB"
runtime_work = { min = 160, max = 230 }
setup_work = 25
cpu_demand = 4
memory_reservation = 8
failure_prior = { kind = "truncated_geometric", failure_probability = { numerator = 1, denominator = 5 }, max_failures = 2, failure_fraction = { min = { numerator = 1, denominator = 3 }, max = { numerator = 2, denominator = 3 } } }

[[task_types]]
id = "GateB"
runtime_work = { min = 45, max = 70 }
setup_work = 55
cpu_demand = 4
memory_reservation = 6
required_capabilities = ["gate-b"]

[[task_types]]
id = "Final"
runtime_work = { min = 120, max = 180 }
setup_work = 80
cpu_demand = 6
memory_reservation = 8
required_capabilities = ["final"]
failure_prior = { kind = "truncated_geometric", failure_probability = { numerator = 1, denominator = 3 }, max_failures = 2, failure_fraction = { min = { numerator = 1, denominator = 2 }, max = { numerator = 3, denominator = 4 } } }

[[task_types]]
id = "CpuLeaf"
runtime_work = { min = 90, max = 140 }
setup_work = 30
cpu_demand = 9
memory_reservation = 3

[[task_types]]
id = "MemLeaf"
runtime_work = { min = 100, max = 150 }
setup_work = 35
cpu_demand = 3
memory_reservation = 12
required_capabilities = ["memory"]

[[task_types]]
id = "Noise"
runtime_work = { min = 60, max = 90 }
setup_work = 15
cpu_demand = 4
memory_reservation = 4

[[workers]]
id = "worker-0-fast-risky"
cpu_capacity = 20
memory_capacity = 24
capabilities = ["gate-a", "gate-b", "final", "memory"]
duration_multipliers = [
  { task_type = "FastA", ratio = { numerator = 1, denominator = 4 } },
  { task_type = "FastB", ratio = { numerator = 1, denominator = 3 } },
  { task_type = "Final", ratio = { numerator = 1, denominator = 4 } },
]
outage_prior = { count = { min = 3, max = 4 }, initial_delay = { min = 80, max = 130 }, uptime = { min = 170, max = 230 }, duration = { min = 80, max = 120 } }

[[workers]]
id = "worker-1-gate-a"
cpu_capacity = 16
memory_capacity = 20
capabilities = ["gate-a", "final"]
duration_multipliers = [
  { task_type = "SlowA", ratio = { numerator = 2, denominator = 3 } },
  { task_type = "GateA", ratio = { numerator = 1, denominator = 2 } },
]

[[workers]]
id = "worker-2-gate-b"
cpu_capacity = 16
memory_capacity = 22
capabilities = ["gate-b"]
duration_multipliers = [
  { task_type = "SlowB", ratio = { numerator = 2, denominator = 3 } },
  { task_type = "GateB", ratio = { numerator = 1, denominator = 2 } },
]

[[workers]]
id = "worker-3-cpu"
cpu_capacity = 22
memory_capacity = 16
duration_multipliers = [
  { task_type = "CpuLeaf", ratio = { numerator = 1, denominator = 3 } },
  { task_type = "Noise", ratio = { numerator = 1, denominator = 2 } },
]

[[workers]]
id = "worker-4-memory"
cpu_capacity = 14
memory_capacity = 30
capabilities = ["memory", "final"]
duration_multipliers = [
  { task_type = "MemLeaf", ratio = { numerator = 1, denominator = 2 } },
  { task_type = "Final", ratio = { numerator = 3, denominator = 4 } },
]
