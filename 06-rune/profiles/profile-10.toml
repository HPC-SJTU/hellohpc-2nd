protocol = "rune-http-v1"
ruleset = "rune-deterministic-v2"
profile = "profile-10"
initial_tasks = [
  { id = "seed-fast-0", task_type = "Fast" },
  { id = "seed-mid-0", task_type = "Mid" },
]

[[releases]]
id = "slow-wave"
task_type = "Slow"
at = { min = 80, max = 130 }
count = { min = 8, max = 12 }

[[releases]]
id = "leaf-wave"
task_type = "Leaf"
at = { min = 180, max = 250 }
count = { min = 10, max = 14 }

[[workflow_templates]]
id = "stagger"
instances = { min = 14, max = 18 }
nodes = [
  { id = "fast", task_type = "Fast" },
  { id = "mid", task_type = "Mid" },
]

[safety_limits]
max_generated_tasks = 1024
max_batch_size = 6
max_identifier_length = 96
max_recent_events = 8192
max_decisions = 50000

[[task_types]]
id = "Fast"
runtime_work = { min = 30, max = 50 }
setup_work = 90
cpu_demand = 3
memory_reservation = 3

[[task_types]]
id = "Mid"
runtime_work = { min = 70, max = 110 }
setup_work = 90
cpu_demand = 3
memory_reservation = 3

[[task_types]]
id = "Slow"
runtime_work = { min = 140, max = 200 }
setup_work = 90
cpu_demand = 3
memory_reservation = 3

[[task_types]]
id = "Wave"
runtime_work = { min = 40, max = 65 }
setup_work = 220
cpu_demand = 3
memory_reservation = 3

[[task_types]]
id = "Leaf"
runtime_work = { min = 80, max = 120 }
setup_work = 40
cpu_demand = 4
memory_reservation = 4

[[derivations]]
id = "fast-wave"
parent_type = "Fast"
successor_type = "Wave"
fanout = { min = 2, max = 3 }

[[derivations]]
id = "mid-wave"
parent_type = "Mid"
successor_type = "Wave"
fanout = { min = 2, max = 3 }

[[derivations]]
id = "slow-wave"
parent_type = "Slow"
successor_type = "Wave"
fanout = { min = 2, max = 3 }

[[derivations]]
id = "wave-leaf"
parent_type = "Wave"
successor_type = "Leaf"
fanout = { min = 1, max = 1 }

[[workers]]
id = "worker-0-wave-risky"
cpu_capacity = 16
memory_capacity = 20
duration_multipliers = [
  { task_type = "Wave", ratio = { numerator = 1, denominator = 4 } },
]
outage_prior = { count = { min = 2, max = 3 }, initial_delay = { min = 90, max = 140 }, uptime = { min = 160, max = 220 }, duration = { min = 70, max = 110 } }

[[workers]]
id = "worker-1-wave-stable"
cpu_capacity = 16
memory_capacity = 20
duration_multipliers = [
  { task_type = "Wave", ratio = { numerator = 3, denominator = 4 } },
  { task_type = "Leaf", ratio = { numerator = 2, denominator = 3 } },
]

[[workers]]
id = "worker-2-fast"
cpu_capacity = 16
memory_capacity = 16
duration_multipliers = [
  { task_type = "Fast", ratio = { numerator = 1, denominator = 3 } },
  { task_type = "Mid", ratio = { numerator = 1, denominator = 2 } },
]

[[workers]]
id = "worker-3-leaf"
cpu_capacity = 16
memory_capacity = 18
duration_multipliers = [
  { task_type = "Leaf", ratio = { numerator = 1, denominator = 3 } },
  { task_type = "Slow", ratio = { numerator = 1, denominator = 2 } },
]
