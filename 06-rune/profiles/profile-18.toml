protocol = "rune-http-v1"
ruleset = "rune-deterministic-v2"
profile = "profile-18"
initial_tasks = [
  { id = "seed-fast-0", task_type = "RootFast" },
  { id = "seed-mid-0", task_type = "RootMid" },
  { id = "seed-slow-0", task_type = "RootSlow" },
]

[[releases]]
id = "fast-wave"
task_type = "RootFast"
at = { min = 50, max = 90 }
count = { min = 4, max = 6 }

[[releases]]
id = "mid-wave"
task_type = "RootMid"
at = { min = 140, max = 200 }
count = { min = 4, max = 6 }

[[releases]]
id = "slow-wave"
task_type = "RootSlow"
at = { min = 250, max = 330 }
count = { min = 4, max = 6 }

[[workflow_templates]]
id = "join"
instances = { min = 8, max = 10 }
nodes = [
  { id = "cpu", task_type = "CpuStage" },
  { id = "mem", task_type = "MemoryStage" },
  { id = "merge", task_type = "RecoveryTail", depends_on = ["cpu", "mem"] },
]

[safety_limits]
max_generated_tasks = 4096
max_batch_size = 6
max_identifier_length = 96
max_recent_events = 16384
max_decisions = 100000

[[task_types]]
id = "RootFast"
runtime_work = { min = 25, max = 45 }
setup_work = 8
cpu_demand = 2
memory_reservation = 2

[[task_types]]
id = "RootMid"
runtime_work = { min = 80, max = 120 }
setup_work = 12
cpu_demand = 2
memory_reservation = 2

[[task_types]]
id = "RootSlow"
runtime_work = { min = 160, max = 230 }
setup_work = 16
cpu_demand = 2
memory_reservation = 2

[[task_types]]
id = "WaveProducer"
runtime_work = { min = 40, max = 70 }
setup_work = 70
cpu_demand = 3
memory_reservation = 3
failure_prior = { kind = "truncated_geometric", failure_probability = { numerator = 1, denominator = 8 }, max_failures = 1, failure_fraction = { min = { numerator = 1, denominator = 3 }, max = { numerator = 2, denominator = 3 } } }

[[task_types]]
id = "CpuStage"
runtime_work = { min = 80, max = 130 }
setup_work = 40
cpu_demand = 9
memory_reservation = 2

[[task_types]]
id = "MemoryStage"
runtime_work = { min = 90, max = 140 }
setup_work = 50
cpu_demand = 3
memory_reservation = 11
required_capabilities = ["memory"]

[[task_types]]
id = "BatchStage"
runtime_work = { min = 40, max = 70 }
setup_work = 220
cpu_demand = 3
memory_reservation = 3

[[task_types]]
id = "ScarceStage"
runtime_work = { min = 120, max = 180 }
setup_work = 60
cpu_demand = 5
memory_reservation = 8
required_capabilities = ["scarce"]
failure_prior = { kind = "truncated_geometric", failure_probability = { numerator = 1, denominator = 5 }, max_failures = 2, failure_fraction = { min = { numerator = 1, denominator = 2 }, max = { numerator = 3, denominator = 4 } } }

[[task_types]]
id = "RecoveryTail"
runtime_work = { min = 100, max = 160 }
setup_work = 70
cpu_demand = 5
memory_reservation = 6
required_capabilities = ["scarce"]

[[derivations]]
id = "fast-producer"
parent_type = "RootFast"
successor_type = "WaveProducer"
fanout = { min = 4, max = 5 }

[[derivations]]
id = "mid-producer"
parent_type = "RootMid"
successor_type = "WaveProducer"
fanout = { min = 4, max = 5 }

[[derivations]]
id = "slow-producer"
parent_type = "RootSlow"
successor_type = "WaveProducer"
fanout = { min = 4, max = 5 }

[[derivations]]
id = "producer-cpu"
parent_type = "WaveProducer"
successor_type = "CpuStage"
fanout = { min = 2, max = 3 }

[[derivations]]
id = "producer-memory"
parent_type = "WaveProducer"
successor_type = "MemoryStage"
fanout = { min = 2, max = 3 }

[[derivations]]
id = "producer-batch"
parent_type = "WaveProducer"
successor_type = "BatchStage"
fanout = { min = 3, max = 4 }

[[derivations]]
id = "producer-scarce"
parent_type = "WaveProducer"
successor_type = "ScarceStage"
fanout = { min = 1, max = 2 }

[[derivations]]
id = "scarce-tail"
parent_type = "ScarceStage"
successor_type = "RecoveryTail"
fanout = { min = 1, max = 2 }

[[workers]]
id = "worker-0-scarce-risky"
cpu_capacity = 22
memory_capacity = 28
capabilities = ["scarce", "memory"]
duration_multipliers = [
  { task_type = "ScarceStage", ratio = { numerator = 1, denominator = 4 } },
  { task_type = "MemoryStage", ratio = { numerator = 1, denominator = 2 } },
]
outage_prior = { count = { min = 4, max = 5 }, initial_delay = { min = 120, max = 180 }, uptime = { min = 200, max = 280 }, duration = { min = 90, max = 140 } }

[[workers]]
id = "worker-1-memory"
cpu_capacity = 16
memory_capacity = 32
capabilities = ["memory"]
duration_multipliers = [
  { task_type = "MemoryStage", ratio = { numerator = 1, denominator = 3 } },
  { task_type = "BatchStage", ratio = { numerator = 3, denominator = 2 } },
]

[[workers]]
id = "worker-2-cpu"
cpu_capacity = 24
memory_capacity = 16
duration_multipliers = [
  { task_type = "CpuStage", ratio = { numerator = 1, denominator = 3 } },
]

[[workers]]
id = "worker-3-batch"
cpu_capacity = 20
memory_capacity = 22
capabilities = ["scarce"]
duration_multipliers = [
  { task_type = "BatchStage", ratio = { numerator = 1, denominator = 4 } },
  { task_type = "WaveProducer", ratio = { numerator = 1, denominator = 2 } },
  { task_type = "ScarceStage", ratio = { numerator = 3, denominator = 4 } },
]

[[workers]]
id = "worker-4-recovery"
cpu_capacity = 18
memory_capacity = 24
capabilities = ["scarce", "memory"]
duration_multipliers = [
  { task_type = "RecoveryTail", ratio = { numerator = 1, denominator = 3 } },
]
outage_prior = { count = { min = 2, max = 3 }, initial_delay = { min = 220, max = 300 }, uptime = { min = 280, max = 380 }, duration = { min = 80, max = 130 } }

[[workers]]
id = "worker-5-stable"
cpu_capacity = 20
memory_capacity = 24
capabilities = ["scarce", "memory"]
duration_multipliers = [
  { task_type = "RecoveryTail", ratio = { numerator = 2, denominator = 3 } },
  { task_type = "CpuStage", ratio = { numerator = 2, denominator = 3 } },
]
