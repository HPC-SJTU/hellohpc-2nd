protocol = "rune-http-v1"
ruleset = "rune-deterministic-v2"
profile = "profile-12"
initial_tasks = [
  { id = "seed-flex-0", task_type = "Flex" },
]

[[releases]]
id = "flex-wave"
task_type = "Flex"
at = { min = 120, max = 180 }
count = { min = 10, max = 14 }

[[releases]]
id = "late-fan"
task_type = "FanoutA"
at = { min = 260, max = 340 }
count = { min = 6, max = 10 }

[[workflow_templates]]
id = "diamond"
instances = { min = 16, max = 20 }
nodes = [
  { id = "left", task_type = "BranchA" },
  { id = "right", task_type = "BranchB" },
  { id = "merge", task_type = "Merge", depends_on = ["left", "right"] },
  { id = "fan-a", task_type = "FanoutA", depends_on = ["merge"] },
  { id = "fan-b", task_type = "FanoutB", depends_on = ["merge"] },
  { id = "final", task_type = "Final", depends_on = ["fan-a", "fan-b"] },
]

[safety_limits]
max_generated_tasks = 1024
max_batch_size = 8
max_identifier_length = 96
max_recent_events = 8192
max_decisions = 50000

[[task_types]]
id = "BranchA"
runtime_work = { min = 80, max = 120 }
setup_work = 35
cpu_demand = 5
memory_reservation = 4

[[task_types]]
id = "BranchB"
runtime_work = { min = 110, max = 160 }
setup_work = 45
cpu_demand = 4
memory_reservation = 7

[[task_types]]
id = "Merge"
runtime_work = { min = 40, max = 70 }
setup_work = 90
cpu_demand = 5
memory_reservation = 8
required_capabilities = ["convergence"]
failure_prior = { kind = "truncated_geometric", failure_probability = { numerator = 1, denominator = 5 }, max_failures = 2, failure_fraction = { min = { numerator = 1, denominator = 3 }, max = { numerator = 2, denominator = 3 } } }

[[task_types]]
id = "FanoutA"
runtime_work = { min = 90, max = 140 }
setup_work = 40
cpu_demand = 7
memory_reservation = 3

[[task_types]]
id = "FanoutB"
runtime_work = { min = 80, max = 130 }
setup_work = 55
cpu_demand = 3
memory_reservation = 10
required_capabilities = ["memory"]

[[task_types]]
id = "Final"
runtime_work = { min = 140, max = 200 }
setup_work = 80
cpu_demand = 6
memory_reservation = 8
required_capabilities = ["final"]
failure_prior = { kind = "truncated_geometric", failure_probability = { numerator = 1, denominator = 4 }, max_failures = 2, failure_fraction = { min = { numerator = 1, denominator = 2 }, max = { numerator = 3, denominator = 4 } } }

[[task_types]]
id = "Flex"
runtime_work = { min = 70, max = 110 }
setup_work = 15
cpu_demand = 4
memory_reservation = 4

[[workers]]
id = "worker-0-fast-risky"
cpu_capacity = 20
memory_capacity = 24
capabilities = ["convergence", "memory", "final"]
duration_multipliers = [
  { task_type = "BranchA", ratio = { numerator = 1, denominator = 4 } },
  { task_type = "Merge", ratio = { numerator = 1, denominator = 3 } },
  { task_type = "Final", ratio = { numerator = 1, denominator = 4 } },
]
outage_prior = { count = { min = 3, max = 4 }, initial_delay = { min = 90, max = 140 }, uptime = { min = 180, max = 240 }, duration = { min = 80, max = 120 } }

[[workers]]
id = "worker-1-branch-b"
cpu_capacity = 16
memory_capacity = 22
capabilities = ["convergence"]
duration_multipliers = [
  { task_type = "BranchB", ratio = { numerator = 1, denominator = 3 } },
  { task_type = "Merge", ratio = { numerator = 3, denominator = 4 } },
]

[[workers]]
id = "worker-2-cpu"
cpu_capacity = 20
memory_capacity = 16
duration_multipliers = [
  { task_type = "FanoutA", ratio = { numerator = 1, denominator = 3 } },
  { task_type = "Flex", ratio = { numerator = 1, denominator = 2 } },
]

[[workers]]
id = "worker-3-memory"
cpu_capacity = 14
memory_capacity = 28
capabilities = ["memory", "final"]
duration_multipliers = [
  { task_type = "FanoutB", ratio = { numerator = 1, denominator = 3 } },
  { task_type = "Final", ratio = { numerator = 3, denominator = 4 } },
]

[[workers]]
id = "worker-4-stable"
cpu_capacity = 18
memory_capacity = 22
capabilities = ["convergence", "final"]
duration_multipliers = [
  { task_type = "Final", ratio = { numerator = 2, denominator = 3 } },
  { task_type = "Merge", ratio = { numerator = 2, denominator = 3 } },
]
