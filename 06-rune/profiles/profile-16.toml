protocol = "rune-http-v1"
ruleset = "rune-deterministic-v2"
profile = "profile-16"
initial_tasks = [
  { id = "seed-batch-0", task_type = "Batch" },
  { id = "seed-bg-0", task_type = "Background" },
]

[[releases]]
id = "wave-a"
task_type = "Batch"
at = { min = 40, max = 80 }
count = { min = 10, max = 14 }

[[releases]]
id = "wave-b"
task_type = "Batch"
at = { min = 120, max = 180 }
count = { min = 18, max = 24 }

[[releases]]
id = "wave-c"
task_type = "Batch"
at = { min = 240, max = 320 }
count = { min = 12, max = 16 }

[[workflow_templates]]
id = "background"
instances = { min = 14, max = 18 }
nodes = [
  { id = "bg", task_type = "Background" },
]

[safety_limits]
max_generated_tasks = 1024
max_batch_size = 4
max_identifier_length = 96
max_recent_events = 8192
max_decisions = 50000

[[task_types]]
id = "Batch"
runtime_work = { min = 35, max = 55 }
setup_work = 300
cpu_demand = 3
memory_reservation = 3
failure_prior = { kind = "truncated_geometric", failure_probability = { numerator = 1, denominator = 5 }, max_failures = 1, failure_fraction = { min = { numerator = 1, denominator = 3 }, max = { numerator = 2, denominator = 3 } } }

[[task_types]]
id = "Background"
runtime_work = { min = 160, max = 230 }
setup_work = 20
cpu_demand = 6
memory_reservation = 6

[[task_types]]
id = "SetupTail"
runtime_work = { min = 80, max = 120 }
setup_work = 180
cpu_demand = 4
memory_reservation = 5
required_capabilities = ["tail"]

[[derivations]]
id = "batch-tail"
parent_type = "Batch"
successor_type = "SetupTail"
fanout = { min = 1, max = 1 }

[[workers]]
id = "worker-0-batch-risky"
cpu_capacity = 18
memory_capacity = 24
capabilities = ["tail"]
duration_multipliers = [
  { task_type = "Batch", ratio = { numerator = 1, denominator = 4 } },
  { task_type = "SetupTail", ratio = { numerator = 1, denominator = 2 } },
]
outage_prior = { count = { min = 4, max = 5 }, initial_delay = { min = 70, max = 110 }, uptime = { min = 140, max = 190 }, duration = { min = 80, max = 130 } }

[[workers]]
id = "worker-1-batch-stable"
cpu_capacity = 18
memory_capacity = 24
capabilities = ["tail"]
duration_multipliers = [
  { task_type = "Batch", ratio = { numerator = 3, denominator = 4 } },
  { task_type = "SetupTail", ratio = { numerator = 3, denominator = 4 } },
]

[[workers]]
id = "worker-2-background"
cpu_capacity = 20
memory_capacity = 24
duration_multipliers = [
  { task_type = "Background", ratio = { numerator = 1, denominator = 2 } },
  { task_type = "Batch", ratio = { numerator = 5, denominator = 4 } },
]

[[workers]]
id = "worker-3-tail-risky"
cpu_capacity = 16
memory_capacity = 20
capabilities = ["tail"]
duration_multipliers = [
  { task_type = "SetupTail", ratio = { numerator = 1, denominator = 3 } },
]
outage_prior = { count = { min = 2, max = 3 }, initial_delay = { min = 160, max = 220 }, uptime = { min = 200, max = 280 }, duration = { min = 70, max = 110 } }

[[workers]]
id = "worker-4-mixed"
cpu_capacity = 16
memory_capacity = 20
capabilities = ["tail"]
duration_multipliers = [
  { task_type = "Background", ratio = { numerator = 2, denominator = 3 } },
  { task_type = "SetupTail", ratio = { numerator = 2, denominator = 3 } },
]
