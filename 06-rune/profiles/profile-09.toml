protocol = "rune-http-v1"
ruleset = "rune-deterministic-v2"
profile = "profile-09"
initial_tasks = [
  { id = "seed-useful-0", task_type = "Useful" },
]

[[releases]]
id = "fast-wave"
task_type = "RootFast"
at = { min = 20, max = 50 }
count = { min = 6, max = 8 }

[[releases]]
id = "mid-wave"
task_type = "RootMid"
at = { min = 90, max = 140 }
count = { min = 6, max = 8 }

[[releases]]
id = "slow-wave"
task_type = "RootSlow"
at = { min = 180, max = 250 }
count = { min = 6, max = 8 }

[[workflow_templates]]
id = "useful"
instances = { min = 10, max = 14 }
nodes = [
  { id = "useful", task_type = "Useful" },
]

[safety_limits]
max_generated_tasks = 1024
max_batch_size = 6
max_identifier_length = 96
max_recent_events = 8192
max_decisions = 50000

[[task_types]]
id = "RootFast"
runtime_work = { min = 25, max = 45 }
setup_work = 8
cpu_demand = 2
memory_reservation = 2

[[task_types]]
id = "RootMid"
runtime_work = { min = 70, max = 110 }
setup_work = 12
cpu_demand = 2
memory_reservation = 2

[[task_types]]
id = "RootSlow"
runtime_work = { min = 140, max = 200 }
setup_work = 16
cpu_demand = 2
memory_reservation = 2

[[task_types]]
id = "BatchHeavy"
runtime_work = { min = 45, max = 70 }
setup_work = 260
cpu_demand = 4
memory_reservation = 3

[[task_types]]
id = "Useful"
runtime_work = { min = 90, max = 130 }
setup_work = 20
cpu_demand = 5
memory_reservation = 5

[[derivations]]
id = "fast-heavy"
parent_type = "RootFast"
successor_type = "BatchHeavy"
fanout = { min = 3, max = 4 }

[[derivations]]
id = "mid-heavy"
parent_type = "RootMid"
successor_type = "BatchHeavy"
fanout = { min = 3, max = 4 }

[[derivations]]
id = "slow-heavy"
parent_type = "RootSlow"
successor_type = "BatchHeavy"
fanout = { min = 3, max = 4 }

[[workers]]
id = "worker-0-batch-fast"
cpu_capacity = 18
memory_capacity = 20
duration_multipliers = [
  { task_type = "BatchHeavy", ratio = { numerator = 1, denominator = 3 } },
]
outage_prior = { count = { min = 2, max = 3 }, initial_delay = { min = 100, max = 150 }, uptime = { min = 180, max = 240 }, duration = { min = 70, max = 110 } }

[[workers]]
id = "worker-1-batch-stable"
cpu_capacity = 18
memory_capacity = 20
duration_multipliers = [
  { task_type = "BatchHeavy", ratio = { numerator = 3, denominator = 4 } },
]

[[workers]]
id = "worker-2-useful"
cpu_capacity = 16
memory_capacity = 20
duration_multipliers = [
  { task_type = "Useful", ratio = { numerator = 1, denominator = 3 } },
  { task_type = "BatchHeavy", ratio = { numerator = 5, denominator = 4 } },
]

[[workers]]
id = "worker-3-mixed"
cpu_capacity = 16
memory_capacity = 18
duration_multipliers = [
  { task_type = "Useful", ratio = { numerator = 2, denominator = 3 } },
  { task_type = "RootSlow", ratio = { numerator = 1, denominator = 2 } },
]
